<!DOCTYPE html>
<html lang="en">
<head>            
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous"/>  

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    
    
    <meta charset="utf-8" />  
    <title>Login - Stock App</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9f9f9;
            color: #444;
            margin: 0;
            padding: 0;
        }

        .header_css {
            background-color: #5a9e9e;
            color: white;
            text-align: center;
            padding: 20px 0;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .centerizeframe {
            background-color: #fff;
            margin: 20px auto;
            padding: 20px;
            width: 40%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .inputframe {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #666;
            display: block;
        }

        input[type="text"], input[type="password"], input[type="email"]{
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            background-color: #f0f0f0;
            text-align: center;
            margin-bottom: 15px; /* 添加底部間距 */
        }

        .button-group {
            text-align: center;
            width: 100%;
            margin-top: 20px;
        }

        .primary-btn, .secondary-btn, .sign_up-btn {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .primary-btn {
            background-color: #5a9e9e;
            color: white;
        }

        .primary-btn:hover {
            background-color: #4a8686;
        }

        .secondary-btn {
            background-color: #e0e0e0;
            color: #555;
        }

        .secondary-btn:hover {
            background-color: #d0d0d0;
        }

        .sign_up-btn {
            background-color: #007bff;
            color: white;
        }

        .sign_up-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header class="header_css">
        Stock App
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
