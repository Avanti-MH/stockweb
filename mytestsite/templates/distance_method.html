<!-- myapp/templates/distance_method.html -->
{% extends "base.html" %}

        {% block content %}
        <script type="text/javascript" src="..\static\js\distance_method.js"></script>
        <div class="centerizeframe">
            <div class="inputframe">
                <div class="input_lef">
                    <label>Stock 1</label>
                    <input id="stock_1" type="text" value="AAPL">
                </div>
                <div class="input_lef">
                    <label>Start Date</label>
                    <input id="start_date" type="date" value="2021-01-01">
                </div>
                <div class="input_rig">
                    <label>Window size</label>
                    <input id="window" type="number" value="200">
                </div>
                <div class="input_rig">
                    <label>Stock 2</label>
                    <input id="stock_2" type="text" value="GLD">
                </div>
                <div class="input_rig">
                    <label>End Date</label>
                    <input id="end_date" type="date" value="2024-01-01">
                </div>
                <div class="input_lef">
                    <label>n * std</label>
                    <input id="n_std" type="number" value="2">
                </div>

            </div>
            
            <div class="button-group">
                <button id="click_action" class="primary-btn">Send</button>
                <button id="reset_action" class="secondary-btn">Reset</button>
            </div>
        </div>

        <div class="chart_arrange">
            <div class="sub_centerizeframe">
            <div id="container_log" hidden="true"></div>
            <div id="container_bollinger_band" hidden="true"></div>
            <div id="container_profits" hidden="true"></div>
            </div>
            <div>
                <table id="container_Table" hidden="true">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Action of Stock 1</th>
                            <th>Stock 1 Price</th>
                            <th>Action of Stock 2</th>
                            <th>Stock 2 Price</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>

        {% endblock %}
